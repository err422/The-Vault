<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open CodeHS — The Web Vault</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f3ff;
      background: radial-gradient(ellipse at top, #30205b 0%, #15121f 55%, #09090d 100%);
    }
    main {
      width: min(100%, 440px); padding: 32px; text-align: center;
      background: rgba(24, 20, 37, .92); border: 1px solid #51406f;
      border-radius: 20px; box-shadow: 0 20px 60px #0007;
    }
    .mark { font-size: 38px; margin-bottom: 12px; }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { color: #c5bfd6; line-height: 1.55; margin: 0 0 24px; }
    a {
      display: inline-block; padding: 13px 22px; border-radius: 11px;
      background: #8b5cf6; color: white; font-weight: 700; text-decoration: none;
      transition: background .15s ease, transform .15s ease;
    }
    a:hover { background: #a78bfa; transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid #ddd6fe; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">↗</div>
    <h1>Open CodeHS</h1>
    <p>Open CodeHS in a regular new browser tab.</p>
    <a href="https://codehs.com/go/67D0A" target="_blank" rel="noopener noreferrer">Open CodeHS ↗</a>
  </main>
</body>
</html>
