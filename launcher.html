<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open The Web Vault</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; min-height: 100vh;
      padding: 18px; background: #090611; color: #f5f3ff;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px); padding: 28px; text-align: center;
      background: linear-gradient(145deg, rgba(139,92,246,.16), rgba(17,12,29,.96));
      border: 1px solid rgba(167,139,250,.32); border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .mark { font-size: 34px; margin-bottom: 8px; }
    h1 { margin: 0 0 8px; font-size: 23px; letter-spacing: -.5px; }
    p { margin: 0 0 22px; color: #c4b5fd; }
    button {
      width: 100%; border: 0; border-radius: 10px; padding: 13px 18px;
      color: white; background: #7c3aed; font: inherit; font-weight: 700;
      cursor: pointer; transition: background .15s, transform .15s;
    }
    button:hover { background: #8b5cf6; }
    button:active { transform: scale(.99); }
    .hint { margin: 14px 0 0; font-size: 12px; color: #a8a0b8; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌁</div>
    <h1>The Web Vault</h1>
    <p>Open the Vault in a separate blank tab.</p>
    <button id="open-vault" type="button">Open The Web Vault ↗</button>
    <div class="hint">If nothing opens, allow pop-ups for this page and try again.</div>
  </main>
  <script>
    (() => {
      const vaultUrl = "https://codehs.com/go/67D0A";
      document.getElementById("open-vault").addEventListener("click", () => {
        // Open synchronously from the click so popup blockers are less likely to stop it.
        const tab = window.open("about:blank", "_blank");
        if (!tab) {
          alert("The new tab was blocked. Allow pop-ups for this page, then try again.");
          return;
        }

        try {
          tab.document.title = "The Web Vault";
          tab.document.documentElement.style.cssText = "height:100%;margin:0;background:#07040d";
          tab.document.body.style.cssText = "height:100%;margin:0;background:#07040d";
          const frame = tab.document.createElement("iframe");
          frame.src = vaultUrl;
          frame.title = "The Web Vault";
          frame.allow = "fullscreen; autoplay; clipboard-read; clipboard-write";
          frame.referrerPolicy = "strict-origin-when-cross-origin";
          frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;background:#07040d";
          tab.document.body.appendChild(frame);
        } catch (error) {
          // Fallback: navigate the new tab directly if the blank document cannot be modified.
          tab.location.href = vaultUrl;
        }
      });
    })();
  </script>
</body>
</html>
