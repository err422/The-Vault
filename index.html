<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault</title>
    <link rel="stylesheet" href="CSS/shared.css">
    <link rel="stylesheet" href="CSS/home.css" id="page-style">
</head>
<body>
    <nav class="nav-bar">
        <!-- ... unchanged, same nav-items as before ... -->
    </nav>

    <main id="app-content" data-page="home">
        <div class="main-content">
            <h1 class="title">The Vault</h1>
            <h2 class="EasterEgg-txt"></h2>
            <div id="clock"></div>
            <div class="search-container">
                <input type="text" id="search-input" class="search-box" placeholder="Search Games and Websites...">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
            </div>
            <div id="search-results" class="search-results"></div>
        </div>

        <button id="chat-bubble-btn" class="chat-bubble-btn">💬</button>

        <div id="chat-window" class="chat-window hidden">
            <div class="chat-header">
                <h3>Chat bot</h3>
                <button id="close-chat-btn" class="close-btn">✖</button>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="message bot-message">Hi! Tell me what kind of games you like!</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="e.g. A scary indie game...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </main>

    <!--External JS-->

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Firebase files -->
    <script src="JS/Shared/FirebaseConfig.js"></script>
    <script src="JS/Shared/AuthCore.js"></script>
    <script src="JS/Shared/AuthUI.js"></script>
    <script defer src="JS/Shared/PlaytimeConsolidation.js"></script>
    <script defer src="JS/Shared/DebugSystem.js"></script>
    <!--Shared-->
    <script src="JS/Shared/VersionChecker.js?v=3"></script>
    <script src="JS/Shared/ThemeLoader.js"></script>
    <script src="JS/Shared/LoadingScreen.js"></script>
    <script src="JS/Shared/PrivacySettings.js"></script>
    <script src="JS/Shared/Stars.js"></script>
    <script src="JS/Shared/Navigation.js"></script>
    <script src="JS/Shared/ChangeLog.js"></script>
    <!--Page-->
    <script src="JS/Pages/Home.js" data-page-script></script>
    <script src="JS/Shared/Chatbot.js" data-page-script></script>

</body>
</html>
